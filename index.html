  <style>
    :root {
      --bg: #eef5fc; --surface: #ffffff; --surface-2: #f2f8fd; --surface-3: #e2f0fb;
      --text: #11324b; --muted: #50708a; --border: #d6e7f4; --border-2: #b7d3e8;
      --primary: #0b74ba; --primary-2: #085e98; --primary-soft: #dbeefc; --sky: #7fc4ef;
      --brand: #1f3fa0;
      --side: 272px; --top: 68px;
      --font: "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    button, a { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
    .ico { width: 21px; height: 21px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

    .app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); grid-template-rows: var(--top) minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .app.collapsed { --side: 86px; }

    /* แถบบน */

      grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px 0 22px;
      background: var(--surface); border-bottom: 1px solid var(--border); z-index: 20;

    .sep { width: 1px; height: 34px; background: var(--border-2); flex: none; }
    .brand-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
    .brand-text b { font-size: 1.05rem; font-weight: 600; letter-spacing: .04em; color: var(--brand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-text small { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .clock { font-size: .88rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; margin-right: 6px; }
    .icon-btn {
      display: inline-grid; place-items: center; width: 44px; height: 44px; flex: none; text-decoration: none;
      border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: var(--muted); cursor: pointer;
    }
    .icon-btn:hover { background: var(--primary-soft); color: var(--primary-2); }
    .menu-btn { display: none; border: 0; background: none; color: var(--text); }

    /* เมนูด้านข้าง */
    .sidebar { display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden auto; z-index: 15; }
    nav { flex: 1; padding: 16px 14px 8px 0; }
    .nav-btn {
      display: flex; align-items: center; gap: 16px; width: 100%; min-height: 60px; margin: 3px 0;
      padding: 6px 14px 6px 26px; border: 0; border-radius: 0 999px 999px 0; background: none;
      text-align: left; cursor: pointer; white-space: nowrap;
    }
    .nav-btn .ico { width: 24px; height: 24px; color: var(--muted); }
    .nav-btn:hover { background: var(--surface-2); }
    .nav-btn.active { background: var(--primary-soft); }
    .nav-btn.active .ico, .nav-btn.active .nav-title { color: var(--primary-2); }
    .nav-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
    .nav-title { font-size: .95rem; font-weight: 600; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; }
    .nav-sub { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
    .divider { height: 1px; margin: 12px 0 12px 22px; background: var(--border); }
    .collapse-btn {
      display: grid; place-items: center; width: 42px; height: 42px; margin: 6px 14px 14px auto;
      border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: var(--muted); cursor: pointer;
    }
    .collapse-btn:hover { background: var(--primary-soft); color: var(--primary-2); }
    .collapse-btn .ico { transform: rotate(180deg); }
    .collapsed nav { padding: 16px 0 8px; }
    .collapsed .nav-btn { justify-content: center; width: 58px; padding: 0; margin: 6px auto; border-radius: 16px; }
    .collapsed .nav-text { display: none; }
    .collapsed .divider { margin: 12px 16px; }
    .collapsed .collapse-btn { margin: 6px auto 14px; }
    .collapsed .collapse-btn .ico { transform: none; }

    /* พื้นที่แสดงผล */
    .stage { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
    .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--surface); }
    .loading {
      position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px;
      background: var(--bg); color: var(--muted); z-index: 2;
    }
    .spinner { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .scrim { display: none; }

    /* แท็บเล็ต: ย่อชื่อในแถบบน */
    @media (max-width: 1000px) {
      .clock { display: none; }
      .brand-text small { display: none; }
    }
    /* มือถือ: เมนูเลื่อนออกจากซ้าย */
    @media (max-width: 640px) {
      .app, .app.collapsed { grid-template-columns: minmax(0, 1fr); --top: 60px; }
      .topbar { padding: 0 8px 0 4px; gap: 6px; }
      .menu-btn { display: inline-grid; }
      .brand { gap: 10px; flex: 1; }
      .logo { width: 104px; }
      .sep, .brand-text, #btn-open, #btn-full { display: none; }
      .icon-btn { border: 0; background: none; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 84vw); z-index: 40;
        transform: translateX(-102%); transition: transform .22s ease-out;
        border-radius: 0 22px 22px 0; box-shadow: 0 18px 50px rgba(12, 62, 102, .25);
      }
      .collapsed .nav-btn { justify-content: flex-start; width: 100%; padding: 6px 14px 6px 26px; margin: 3px 0; border-radius: 0 999px 999px 0; }
      .collapsed .nav-text { display: flex; }
      .nav-open .sidebar { transform: none; }
      .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(9, 48, 78, .38); }
      .collapse-btn { display: none; }
      .stage { grid-column: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } .sidebar { transition: none; } }
  </style>
</head>

<script>
  /* =====================================================================
   * เมนูด้านข้าง — เพิ่ม/ลบ/สลับลำดับหัวข้อได้ที่นี่
   *   title : ชื่อหัวข้อ (ภาษาอังกฤษ)   sub : คำอธิบายภาษาไทย
   *   icon  : board | map | chart | doc   url : หน้าที่จะแสดง (ต้องเป็นหน้าที่ยอมให้ฝังในกรอบได้)
   *   { divider: true } = เส้นคั่นหมวด
   * ===================================================================== */
  const MENU = [
    {
      id: 'monitor', title: 'MONITORING CENTER', sub: 'ภาพรวมงานซ่อม Real-time', icon: 'board',
      url: 'https://script.google.com/macros/s/AKfycbwOpoaH12S6oLyJKv4k8oZcjVZWWhvT7jGIKZkN9skCroJV9TEjktAQiEFtcwbbUIVA/exec',
    },
    {
      // รายงาน Looker Studio: MAINTENANCE REPORT (KPI / Oil / Attendance ฯลฯ กดเปลี่ยนหน้าในรายงานได้)
      id: 'kpi', title: 'KPI DASHBOARD', sub: 'รายงาน KPI ซ่อมบำรุง', icon: 'chart',
      url: 'https://lookerstudio.google.com/embed/reporting/d6d10be2-363d-4726-b2b1-0dc940e9113b/page/p_dfqav3pszd',
    },
    { divider: true },
    {
      // หน้าผังใน Apps Script ของ Monitoring Center (?page=layout) — เครื่องเป็นสีแดงตามใบงานจริงในชีต
      id: 'layout', title: 'PLANT LAYOUT', sub: 'ผังโรงงาน สถานะเครื่องจักร', icon: 'map',
      url: 'https://script.google.com/macros/s/AKfycbwOpoaH12S6oLyJKv4k8oZcjVZWWhvT7jGIKZkN9skCroJV9TEjktAQiEFtcwbbUIVA/exec?page=layout',
    },
    // เพิ่มหัวข้อใหม่: { id: 'ชื่อไม่ซ้ำ', title: '...', sub: '...', icon: 'board|map|chart|doc', url: '...' },
  ];

  (function () {
    'use strict';
    const $ = s => document.querySelector(s);
    const app = $('#app');
    const stage = $('#stage');
    const items = MENU.filter(m => !m.divider);
    // ทดสอบบนเครื่อง: ?layout=<url> ใช้แทนลิงก์ผังโรงงาน
    const over = new URLSearchParams(location.search).get('layout');
    if (over) items.find(m => m.id === 'layout').url = over;

    const ico = n => `<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
    $('#nav').innerHTML = MENU.map(m => m.divider ? '<div class="divider" role="separator"></div>' : `
      <button type="button" class="nav-btn" data-id="${m.id}" title="${m.title} · ${m.sub}">
        ${ico(m.icon)}<span class="nav-text"><span class="nav-title">${m.title}</span><span class="nav-sub">${m.sub}</span></span>
      </button>`).join('');

    const frames = new Map();       // เก็บกรอบที่เปิดแล้วไว้ สลับกลับมาไม่ต้องโหลดใหม่
    let current = null;

    function frameFor(m) {
      let f = frames.get(m.id);
      if (f) return f;
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="loading"><div class="spinner"></div><span>กำลังโหลด ${m.title}…</span></div>`;
      const loading = wrap.firstElementChild;
      const iframe = document.createElement('iframe');
      iframe.title = m.title;
      iframe.allow = 'fullscreen; clipboard-write';
      iframe.addEventListener('load', () => loading.remove());
      iframe.src = m.url;
      stage.append(iframe, loading);
      f = { iframe, loading };
      frames.set(m.id, f);
      return f;
    }

    function show(id) {
      const m = items.find(x => x.id === id) || items[0];
      if (location.hash !== '#' + m.id) history.replaceState(null, '', '#' + m.id);
      frameFor(m);
      for (const [fid, f] of frames) {
        f.iframe.hidden = fid !== m.id;
        if (f.loading.isConnected) f.loading.hidden = fid !== m.id;
      }
      document.querySelectorAll('.nav-btn').forEach(b => {
        const on = b.dataset.id === m.id;
        b.classList.toggle('active', on);
        if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      });
      $('#btn-open').href = m.url;
      document.title = `${m.title} · Maintenance Monitoring Center`;
      current = m;
      setNav(false);
    }

    function setNav(open) {
      app.classList.toggle('nav-open', open);
      $('#scrim').hidden = !open;
      $('#btn-menu').setAttribute('aria-expanded', String(open));
    }

    function setCollapsed(c) {
      app.classList.toggle('collapsed', c);
      const b = $('#btn-collapse');
      b.title = c ? 'ขยายเมนู' : 'ย่อเมนู';
      b.setAttribute('aria-label', b.title);
    }

    $('#nav').addEventListener('click', e => {
      const b = e.target.closest('.nav-btn');
      if (b) show(b.dataset.id);
    });
    window.addEventListener('hashchange', () => show(location.hash.slice(1)));
    $('#btn-menu').addEventListener('click', () => setNav(!app.classList.contains('nav-open')));
    $('#scrim').addEventListener('click', () => setNav(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setNav(false); });
    $('#btn-collapse').addEventListener('click', () => {
      const c = !app.classList.contains('collapsed');
      setCollapsed(c);
      try { localStorage.setItem('mmc.side', c ? 'collapsed' : 'open'); } catch (e) { /* ignore */ }
    });
    $('#btn-reload').addEventListener('click', () => {
      const f = frames.get(current.id);
      if (!f) return;
      if (!f.loading.isConnected) stage.append(f.loading);
      f.loading.hidden = false;
      f.iframe.src = current.url;
    });
    $('#btn-full').addEventListener('click', () => {
      const f = frames.get(current.id);
      if (f && f.iframe.requestFullscreen) f.iframe.requestFullscreen().catch(() => {});
    });

    const clock = () => {
      $('#clock').textContent = new Date().toLocaleString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    };
    clock();
    setInterval(clock, 20000);

    let side = null;
    try { side = localStorage.getItem('mmc.side'); } catch (e) { /* ignore */ }
    setCollapsed(side ? side === 'collapsed' : window.innerWidth < 1100);
    show(location.hash.slice(1));
  })();
</script>
</body>
</html>
